name: Déploiement GitHub Pages

on:
  # Se déclenche après un CI réussi sur main plutôt que sur push : garantit
  # qu'on ne déploie jamais un commit dont lint/typecheck/tests/build ont
  # échoué, y compris en cas de push direct sur main.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        env:
          # Un dépôt de projet (pas <user>.github.io) est servi sous
          # /<nom-du-dépôt>/ plutôt qu'à la racine du domaine : voir `base`
          # dans vite.config.ts et src/lib/basePath.ts.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - name: Fallback SPA (routes /roue, /stock… rechargées ou ouvertes directement)
        # GitHub Pages ne connaît pas les routes de l'app : sans ceci, ouvrir ou
        # recharger un lien partagé donnerait un 404 au lieu de servir l'app,
        # qui route elle-même via location.pathname une fois chargée.
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
